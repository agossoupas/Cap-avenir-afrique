<!doctype html>
<html lang="fr">
<head>

  <meta name="theme-color" content="#087443">

  <title>Hors connexion — Cap Avenir Afrique</title>
  <style>
    :root{color-scheme:light;font-family:Arial,sans-serif;background:#f4f8f5;color:#183329}

    main{width:min(100%,440px);background:#fff;border:1px solid #e2ebe5;border-radius:22px;padding:30px;text-align:center;box-shadow:0 12px 35px #153b2512}
    .mark{width:66px;height:66px;margin:0 auto 18px;border-radius:20px;background:#087443;color:white;display:grid;place-items:center;font-size:34px;font-weight:800}
    h1{font-size:25px;margin:0 0 12px;color:#064b2e}p{line-height:1.6;color:#52645a;margin:0 0 22px}
    a,button{display:inline-block;border:0;border-radius:12px;padding:13px 18px;font-weight:700;text-decoration:none;font-size:15px;cursor:pointer}
    a{background:#087443;color:#fff}button{background:#edf4ef;color:#24533b;margin-top:10px}
  </style>
</head>
<body>
  <main>
    <div class="mark">C</div>
    <h1>Tu es hors connexion</h1>
    <p>Cap Avenir Afrique n'arrive pas à charger cette page pour le moment. Vérifie ta connexion Internet puis réessaie. Les pages déjà consultées peuvent rester disponibles hors connexion.</p>
    <a href="./index.html">Retour à l'accueil</a><br>
    <button type="button" onclick="location.reload()">Réessayer</button>
  </main>
</body>
